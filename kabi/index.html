<!doctype html>
<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#f5f4ee;--mute:#d3d5ce;--spore:#e8d36a;--mist:#a9dcec;--night:#07090a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#scroll{height:1800vh}
#scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,8,9,.88) 0,rgba(6,8,9,.66) 30%,rgba(6,8,9,0) 55%)}
.cap{position:fixed;left:clamp(20px,5vw,72px);top:50%;transform:translateY(-50%);width:min(42vw,580px);opacity:0;visibility:hidden;pointer-events:none}
.cap h2{margin:0 0 .55em;font-weight:900;font-size:clamp(28px,3.5vw,52px);line-height:1.32;letter-spacing:.01em;word-break:auto-phrase;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.cap p{margin:0 0 .9em;font-size:clamp(15px,1.25vw,18px);line-height:1.85;color:var(--mute);word-break:auto-phrase;text-wrap:pretty;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.cap em{font-style:normal;color:var(--spore)}
.cap .c{color:var(--mist)}
.vo{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid rgba(255,255,255,.4);border-radius:6px;background:rgba(0,0,0,.25);color:var(--ink);font:500 14px "Noto Sans JP",sans-serif;cursor:pointer}
.btn{display:inline-block;padding:13px 22px;border-radius:6px;background:var(--ink);color:#141a1b;font-weight:900;text-decoration:none;font-size:15px}
#tag{position:fixed;left:clamp(20px,5vw,72px);top:18px;font-size:13px;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.9)}
#note{position:fixed;right:18px;top:18px;font-size:12px;color:var(--mute);background:rgba(9,12,13,.55);padding:5px 10px;border-radius:5px}
#bar{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:3px;height:30vh;background:rgba(255,255,255,.16);border-radius:2px}
#bar i{display:block;width:100%;height:0;background:var(--ink);border-radius:2px}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:13px;color:var(--mute);transition:opacity .3s}
#err{display:none;position:fixed;inset:0;padding:30px;background:var(--night);line-height:1.8}
@media (max-width:760px),(max-aspect-ratio:1/1){
 #scrim{background:linear-gradient(0deg,rgba(6,8,9,.94) 0,rgba(6,8,9,.8) 32%,rgba(6,8,9,0) 54%)}
 .cap{left:20px;right:20px;top:auto;bottom:24px;transform:none;width:auto}
 .cap h2{font-size:clamp(24px,7vw,34px)}
 .cap p{font-size:14.5px;line-height:1.75}
 #bar{display:none}
 #tag{top:12px;left:14px;font-size:11px}
 #note{top:32px;left:14px;right:auto;font-size:10.5px;padding:3px 8px}
 #hint{bottom:6px}
}
.fxb{position:fixed;right:18px;bottom:60px;z-index:20;min-height:48px;padding:12px 22px;border:0;border-radius:6px;background:var(--ink);color:#141a1b;font:900 16px "Noto Sans JP",sans-serif;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.fxc{position:fixed;right:18px;bottom:20px;z-index:20;min-height:32px;padding:4px 10px;border:1px solid rgba(255,255,255,.28);border-radius:5px;background:rgba(9,12,13,.72);color:var(--mute);font:500 12.5px "Noto Sans JP",sans-serif;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.fxc b{color:var(--ink);font-size:15px;font-weight:900}
.fxt{display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;padding:5px 14px;border-radius:5px;background:var(--spore);color:#1b1a08;font:900 13px "Noto Sans JP",sans-serif;white-space:nowrap}.fxt.on{display:block}
.fxd{display:none;position:fixed;z-index:19;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--spore);border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.55);pointer-events:none}.fxd.on{display:block}
.fxp{display:none;position:fixed;right:0;top:0;bottom:0;z-index:30;width:380px;padding:22px 20px 24px;overflow:auto;overscroll-behavior:contain;background:#0d1112;border-left:1px solid rgba(255,255,255,.14);color:var(--ink);font-size:14.5px;line-height:1.7}.fxp.on{display:block}
.fixing .fxb,.fixing .fxc,.fixing #hint{display:none}.fixing .cap{pointer-events:none!important}
.fxh{margin:0 0 .6em;font-size:20px;font-weight:900;line-height:1.45;word-break:auto-phrase}.fxh.fxw,.fxw{color:var(--spore)}
.fxp h4{margin:1.1em 0 .3em;font-size:14.5px;font-weight:900}
.fxm{margin:0 0 .7em;color:var(--mute)}.fxn{margin:0 0 .9em;padding:7px 10px;border-left:3px solid var(--mist);color:var(--mist);font-weight:500}
.fxa{display:block;width:100%;margin:.2em 0 .8em;padding:10px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:#050708;color:var(--ink);font:500 16px/1.6 "Noto Sans JP",sans-serif;resize:vertical}.fxa:focus{outline:2px solid var(--mist);outline-offset:1px}
.fxr{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.fxact{position:sticky;bottom:-24px;margin:12px -20px -24px;padding:10px 20px 14px;background:#0d1112;border-top:1px solid rgba(255,255,255,.14)}
.fxk{min-height:44px;padding:8px 14px;border:1px solid rgba(255,255,255,.34);border-radius:6px;background:transparent;color:var(--ink);font:500 14px "Noto Sans JP",sans-serif;cursor:pointer}
.fxk.fxp1{background:var(--ink);border-color:var(--ink);color:#141a1b;font-weight:900}.fxk:disabled{opacity:.4;cursor:default}
.fxl{display:flex;flex-direction:column;gap:3px;margin:0 0 12px;padding:10px 0 2px;border-top:1px solid rgba(255,255,255,.14)}.fxl b{font-weight:900}.fxl i{font-style:normal;color:var(--mute);font-size:12.5px}.fxl span{color:var(--mute)}.fxl.fxo{opacity:.55}
.fxba{display:flex;flex-direction:column;gap:1px}.fxp .fxa2{color:var(--ink);font-weight:500}
.fxg{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}.fxg figure{position:relative;margin:0}.fxg canvas{display:block;width:100%;height:auto;border-radius:4px}.fxg figcaption{position:absolute;left:6px;top:6px;padding:1px 8px;border-radius:4px;background:rgba(6,8,9,.82);color:var(--ink);font-size:13px;font-weight:900}
.fxs{display:grid;grid-template-columns:22px repeat(4,1fr);gap:3px;align-items:center;margin-top:5px}.fxs canvas{display:block;width:100%;height:auto;border-radius:3px}
@media (max-width:760px),(max-aspect-ratio:1/1){
 .fxb{right:12px;top:62px;bottom:auto;min-height:44px;padding:9px 16px;font-size:15px}
 .fxc{right:12px;top:112px;bottom:auto}
 .fxg{grid-template-columns:1fr 1fr}
 .fxp{left:0;top:auto;width:auto;height:62vh;padding:16px 16px 20px;border-left:0;border-top:1px solid rgba(255,255,255,.2);border-radius:12px 12px 0 0}
 .fxt{left:auto;right:12px;top:156px;transform:none;font-size:11.5px}
 .fixing .fxt{left:50%;right:auto;top:auto;bottom:calc(62vh + 8px);transform:translateX(-50%)}
 .fxact{bottom:-20px;margin:12px -16px -20px;padding:10px 16px 14px}
 .fixing .cap{display:none}
}
#boot{position:fixed;inset:0;z-index:50;background:var(--night);display:grid;place-items:center;transition:opacity .7s ease}#boot i{display:block;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,rgba(169,220,236,.9) 0,rgba(169,220,236,.25) 38%,rgba(169,220,236,0) 70%);animation:bp 1.5s ease-in-out infinite}@keyframes bp{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.25);opacity:1}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="boot" aria-hidden="true"><i></i></div>
<canvas id="c" aria-hidden="true"></canvas>
<div id="scrim"></div>
<div id="tag"></div>
<div id="note"></div>
<div id="bar"><i></i></div>
<div id="caps"></div>
<div id="hint">下へスクロール</div>
<div id="scroll"></div>
<div id="err">この図を表示できませんでした（お使いの端末で3D表示が使えないようです）。</div>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const S=await fetch('scene.json',{cache:'no-store'}).then(r=>r.json());
document.getElementById('tag').textContent=S.tag;
document.getElementById('note').textContent=S.note;
const capsEl=document.getElementById('caps');
S.chapters.forEach(ch=>{const s=document.createElement('section');s.className='cap';s.dataset.a=ch.a;s.dataset.b=ch.b;
 s.innerHTML=`<h2>${ch.title}</h2><p>${ch.body}</p>`;
 if(ch.voice){const b=document.createElement('button');b.className='vo';b.textContent='▶ 職人の声を聞く';const au=new Audio(ch.voice);b.onclick=()=>{au.paused?au.play():au.pause();};s.append(b);}
 if(ch.cta){const a=document.createElement('a');a.className='btn';a.href=S.contact;a.target='_blank';a.rel='noopener';a.textContent='無料で相談する';if(ch.voice)a.style.marginLeft='12px';s.append(a);}
 capsEl.append(s);});

const qp=new URLSearchParams(location.search);
const T_START=performance.now();const PROF=[];let _tp=T_START;const mark=n=>{const t=performance.now();PROF.push([n,Math.round(t-_tp)]);_tp=t;};
const canvas=document.getElementById('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});}
catch(e){document.getElementById('err').style.display='block';throw e;}

// 画質の段（スマホは軽く）
const phone=innerWidth<760;
const Q=phone
 ?{dpr:1.5,samples:2,cell:.03,glove:.009,soft:.035,vol:.34,steps:16,ao:6,bloom:4,noise:48,shadow:1024,sheet:[90,80],crinkle:1024,wood:1200,rocks:.45,hyphae:2600,drops:160}
 :{dpr:1.5,samples:4,cell:.03,glove:.009,soft:.035,vol:.5,steps:38,ao:10,bloom:5,noise:48,shadow:2048,sheet:[190,170],crinkle:1024,wood:1200,rocks:1,hyphae:6200,drops:420};
renderer.setPixelRatio(Math.min(devicePixelRatio,Q.dpr));
renderer.toneMapping=THREE.NoToneMapping;       // 仕上げは自前の最終パスでやる
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030405);
const camera=new THREE.PerspectiveCamera(36,1,.03,80);

// ===== 重い形の控え（geo.pak）=====
// 人・布団・機械・木目は、同じコードで先に計算した結果を1ファイルにまとめてある。無ければその場で計算する。
const PAK={},NEW={},NEWC={};const REBAKE=new Set((qp.get('rebake')||'').split(',').filter(Boolean));
if(!qp.has('bake')&&'DecompressionStream' in window){try{const r=await fetch('geo.pak',{cache:'no-cache'});if(r.ok){const buf=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(),hl=new Uint32Array(buf,0,1)[0],head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl))),base=4+hl;
  for(const it of head){const bytes=new Uint8Array(buf,base+it.o,it.l).slice();PAK[it.n]={...it,bytes};if(it.k==='i'&&!REBAKE.has(it.n))PAK[it.n].bmp=await createImageBitmap(new Blob([bytes],{type:'image/webp'}));}}}catch(e){console.warn('geo.pak',e);}}
const fromPak=n=>PAK[n]&&!REBAKE.has(n)?PAK[n]:null;
function packGeo(name,d){const nv=d.pos.length/3,mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let i=0;i<nv*3;i++){const c=i%3,v=d.pos[i];if(v<mn[c])mn[c]=v;if(v>mx[c])mx[c]=v;}
 const p16=new Uint16Array(nv*3);for(let i=0;i<nv*3;i++){const c=i%3;p16[i]=Math.round((d.pos[i]-mn[c])/Math.max(1e-6,mx[c]-mn[c])*65535);}
 const col=d.col?Uint8Array.from(d.col,v=>Math.round(Math.min(1,Math.max(0,Math.sqrt(v)))*255)):null,idx=nv<65536?Uint16Array.from(d.idx):Uint32Array.from(d.idx);
 const parts=[new Uint8Array(p16.buffer),new Uint8Array(idx.buffer)];if(col)parts.push(col);if(d.sI){parts.push(Uint8Array.from(d.sI));parts.push(Uint8Array.from(d.sW,v=>Math.round(v*255)));}
 NEW[name]={meta:{k:'g',nv,ni:d.idx.length,mn,mx,col:!!col,skin:!!d.sI},parts};}
function unpackGeo(e){const nv=e.nv,ni=e.ni,b=e.bytes,mn=e.mn,mx=e.mx;let o=0;const p16=new Uint16Array(b.buffer.slice(b.byteOffset,b.byteOffset+nv*6));o+=nv*6;const pos=new Float32Array(nv*3);for(let i=0;i<nv*3;i++){const c=i%3;pos[i]=mn[c]+p16[i]/65535*(mx[c]-mn[c]);}
 const ib=nv<65536?2:4,idx=(nv<65536?new Uint16Array(b.buffer.slice(b.byteOffset+o,b.byteOffset+o+ni*2)):new Uint32Array(b.buffer.slice(b.byteOffset+o,b.byteOffset+o+ni*4)));o+=ni*ib;
 let col=null,sI=null,sW=null;if(e.col){const c8=b.subarray(o,o+nv*3);col=new Float32Array(nv*3);for(let i=0;i<nv*3;i++){const v=c8[i]/255;col[i]=v*v;}o+=nv*3;}if(e.skin){sI=b.slice(o,o+nv*4);o+=nv*4;sW=b.slice(o,o+nv*4);}return{pos,idx,col,sI,sW};}
function cachedGeo(name,gen){const e=fromPak(name);if(e)return unpackGeo(e);seedFor(name);const d=gen();packGeo(name,d);return d;}
function toGeo(d){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(d.pos,3));if(d.col)g.setAttribute('color',new THREE.BufferAttribute(d.col,3));if(d.sI){g.setAttribute('skinIndex',new THREE.BufferAttribute(Uint16Array.from(d.sI),4));g.setAttribute('skinWeight',d.sW instanceof Uint8Array?new THREE.BufferAttribute(Float32Array.from(d.sW,v=>v/255),4):new THREE.BufferAttribute(d.sW,4));}g.setIndex(new THREE.BufferAttribute(d.idx,1));g.computeVertexNormals();return g;}
window.__savePak=async()=>{const all=[];for(const n of Object.keys(PAK))if(!NEW[n]&&!NEWC[n])all.push({n,meta:PAK[n],parts:[PAK[n].bytes]});for(const n of Object.keys(NEW))all.push({n,meta:NEW[n].meta,parts:NEW[n].parts});
 for(const n of Object.keys(NEWC)){const bl=await new Promise(r=>NEWC[n].toBlob(r,'image/webp',.92));all.push({n,meta:{k:'i'},parts:[new Uint8Array(await bl.arrayBuffer())]});}
 let o=0;const head=[];for(const a of all){const l=a.parts.reduce((q,p)=>q+p.length,0);const{bytes,bmp,o:_o,l:_l,n:_n,...m}=a.meta;head.push({n:a.n,...m,o,l});o+=l;}
 const hb=new TextEncoder().encode(JSON.stringify(head)),hl=new Uint8Array(new Uint32Array([hb.length]).buffer),chunks=[hl,hb];for(const a of all)chunks.push(...a.parts);
 const gz=await new Response(new Blob(chunks).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
 const r=await fetch('http://127.0.0.1:8982/save?name=geo.pak',{method:'POST',body:gz});return{raw:o,gz:gz.byteLength,items:head.map(h=>[h.n,h.l]),status:await r.text()};};

// ===== 道具 =====
let _seed=0x2F6E2B1;
const seedFor=n=>{let h=0x811c9dc5;for(let i=0;i<n.length;i++)h=Math.imul(h^n.charCodeAt(i),16777619);_seed=h;};   // 毎回同じ部屋になるよう乱数を固定する
const R=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const gf=x=>{const s=String(x);return s.includes('.')||s.includes('e')?s:s+'.';};
const lin=hex=>{const c=new THREE.Color(hex);return[c.r,c.g,c.b];};

const PERM=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)PERM[i]=p[i&255];}
const fade=t=>t*t*t*(t*(t*6-15)+10);
const grad3=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);};
function pnp(x,y,z,per=256){const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z),m=per-1,X=fx&m,Y=fy&m,Z=fz&m,X1=(X+1)&m,Y1=(Y+1)&m,Z1=(Z+1)&m;x-=fx;y-=fy;z-=fz;const u=fade(x),v=fade(y),w=fade(z),H=(a,b,c)=>PERM[(PERM[(PERM[a&255]+b)&255]+c)&255];
 return lerp(lerp(lerp(grad3(H(X,Y,Z),x,y,z),grad3(H(X1,Y,Z),x-1,y,z),u),lerp(grad3(H(X,Y1,Z),x,y-1,z),grad3(H(X1,Y1,Z),x-1,y-1,z),u),v),
  lerp(lerp(grad3(H(X,Y,Z1),x,y,z-1),grad3(H(X1,Y,Z1),x-1,y,z-1),u),lerp(grad3(H(X,Y1,Z1),x,y-1,z-1),grad3(H(X1,Y1,Z1),x-1,y-1,z-1),u),v),w);}
const pn3=(x,y,z)=>pnp(x,y,z,256);
const ridge=n=>{const r=1-Math.abs(n)*1.6;return r<0?0:r*r;};

function canvasTex(w,h,draw,{srgb=true,aniso=8}={}){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;t.anisotropy=aniso;return t;}
function pixTex(w,h,fn,o){return canvasTex(w,h,(g)=>{const im=g.createImageData(w,h),d=im.data;for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i+=4){d[i+3]=255;fn(x,y,d,i);}g.putImageData(im,0,0);},o);}
function pakTex(name,w,h,fn,o){const e=fromPak(name);if(e&&e.bmp)return canvasTex(w,h,g=>g.drawImage(e.bmp,0,0),o);seedFor(name);const t=pixTex(w,h,fn,o);NEWC[name]=t.image;return t;}
function speckle(g,s,base,cols,n,rmax){g.fillStyle=base;g.fillRect(0,0,s,s);for(let i=0;i<n;i++){g.fillStyle=cols[Math.floor(rnd(cols.length))];g.globalAlpha=rnd(.05,.3);g.beginPath();g.arc(rnd(s),rnd(s),rnd(.4,rmax),0,7);g.fill();}g.globalAlpha=1;}

// 3Dノイズ（霧と布のしわの元。繰り返しても継ぎ目が出ない）
const NOISE3=(()=>{const N=Q.noise;let data;const pe=fromPak('noise3');if(pe)data=pe.bytes;else{seedFor('noise3');data=new Uint8Array(N*N*N*2);const A=new Float32Array(N*N*N),B=new Float32Array(N*N*N);
 const pts=n=>{const a=new Float32Array(n*n*n*3);for(let i=0;i<a.length;i++)a[i]=R();return a;};
 const p4=pts(4),p8=pts(8),p16=pts(16);
 const wor=(x,y,z,n,a)=>{const X=x*n,Y=y*n,Z=z*n,ix=Math.floor(X),iy=Math.floor(Y),iz=Math.floor(Z);let md=9;
  for(let dz=-1;dz<=1;dz++)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const cx=(ix+dx+n)%n,cy=(iy+dy+n)%n,cz=(iz+dz+n)%n,q=(cx+n*(cy+n*cz))*3,px=ix+dx+a[q]-X,py=iy+dy+a[q+1]-Y,pz=iz+dz+a[q+2]-Z,d=px*px+py*py+pz*pz;if(d<md)md=d;}

 return best;}

// ===== 受付の画面 =====
const U=S.ui||{};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const plainOf=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent;};
const fixBtn=mk('button','fxb',U.button);fixBtn.id='fixBtn';fixBtn.type='button';
const fixCount=mk('button','fxc');fixCount.id='fixCount';fixCount.type='button';fixCount.append(mk('span','',U.count),mk('b','','0'),mk('span','',U.countUnit));
const fixTest=mk('div','fxt',U.testLabel);fixTest.id='fixTest';
const fixPanel=mk('aside','fxp');fixPanel.id='fixPanel';fixPanel.setAttribute('aria-label',U.button);
const fixDot=mk('div','fxd');fixDot.id='fixDot';
document.body.append(fixBtn,fixCount,fixTest,fixPanel,fixDot);
const FX={open:false,held:null,openP:0,tap:null,pending:null,st:null,busy:false,rec:null,timer:0,text:'',base:{chapters:S.chapters,craft:S.craft||CRAFT0}};
const clearP=()=>{if(FX.rec){try{FX.rec.stop();}catch(e){}FX.rec=null;}clearInterval(FX.timer);fixPanel.replaceChildren();};
const row=(...b)=>{const r=mk('div','fxr');r.append(...b);return r;};
const pbtn=(label,fn,cls='fxk')=>{const b=mk('button',cls,label);b.type='button';b.onclick=fn;return b;};
async function api(path,body){try{const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});let d=null;try{d=await r.json();}catch(e){}return{ok:r.ok,status:r.status,data:d};}catch(e){return{ok:false,status:0,data:null};}}
async function refreshState(){let h=null;try{const r=await fetch('history.json',{cache:'no-store'});if(r.ok)h=await r.json();}catch(e){}
 let st={server:false,key:false,test:false,count:0,history:[]};if(h){st.history=h.entries||[];st.count=st.history.filter(e=>!e.withdrawn_at).length;}
 if(h&&h.served_by){const a=await api('/api/state');if(a.ok&&a.data&&a.data.server)st=a.data;}
 FX.st=st;fixCount.querySelector('b').textContent=st.count;fixTest.classList.toggle('on',!!st.test);return st;}
function setView(){if(portrait)return;viewX=FX.open?Math.max(0,(W*.47+W-380)/2-W/2):null;camera.setViewOffset(W,H,-(viewX??W*.17),0,W,H);camera.updateProjectionMatrix();}
function chapterNow(){const q=qOf(FX.openP);let c=S.chapters[0];for(const ch of S.chapters)if(q>=ch.a-.008)c=ch;return c;}
function goP(p){if(FX.held!==null){FX.held=p;}else{const m=document.documentElement.scrollHeight-innerHeight;scrollTo({top:m*p,behavior:'instant'});}cur=p;}
async function openPanel(kind){if(FX.open)return;FX.open=true;FX.held=frozen;FX.openP=cur;frozen=cur;FX.tap=null;FX.text='';document.body.classList.add('fixing');fixPanel.classList.add('on');setView();await refreshState();kind==='history'?showHistory():showInput();}
function closePanel(){clearP();FX.open=false;fixDot.classList.remove('on');fixPanel.classList.remove('on');document.body.classList.remove('fixing');frozen=FX.held;if(frozen===null)cur=prog();setView();}
function endMsg(title,lines,cls){clearP();fixPanel.append(mk('h3','fxh'+(cls?' '+cls:''),title));for(const l of lines)fixPanel.append(mk('p','fxm',l));return fixPanel;}
function showInput(note){clearP();const st=FX.st;if(FX.tap)fixDot.classList.add('on');
 if(!st.server){endMsg(U.button,[U.noServer],'fxw').append(row(pbtn(U.close,closePanel)));return;}
 if(!st.key){const e=endMsg(U.button,[st.noKeyMessage],'fxw');e.append(row(pbtn(U.historyTitle,showHistory),pbtn(U.close,closePanel)));return;}
 fixPanel.append(mk('h3','fxh',U.inputTitle));if(note)fixPanel.append(mk('p','fxn',note));
 const ch=chapterNow();fixPanel.append(mk('p','fxm',`${U.sceneLabel}：${plainOf(ch.title)}`));
 const tp=mk('p','fxm',FX.tap?`${U.tapLabel}：${FX.tap.label}`:U.tapHint);tp.id='fixTap';fixPanel.append(tp);
 const ta=mk('textarea','fxa');ta.id='fixText';ta.placeholder=U.placeholder;ta.maxLength=400;ta.rows=4;ta.value=FX.text;ta.oninput=()=>{FX.text=ta.value;send.disabled=!ta.value.trim();};fixPanel.append(ta);
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,btns=[];
 const send=pbtn(U.send,()=>propose(ta.value,ch.id),'fxk fxp1');send.disabled=!ta.value.trim();send.id='fixSend';
 btns.push(send);
 if(SR){const sp=pbtn(U.speak,()=>{if(FX.rec){FX.rec.stop();return;}const rc=new SR(),head=ta.value;rc.lang='ja-JP';rc.interimResults=true;rc.continuous=true;rc.onresult=e=>{let s='';for(const a of e.results)s+=a[0].transcript;ta.value=(head+s).slice(0,400);ta.oninput();};rc.onerror=()=>{const n=document.getElementById('fixTap');if(n)n.textContent=U.speakFail;};rc.onend=()=>{FX.rec=null;sp.textContent=U.speak;};FX.rec=rc;sp.textContent=U.speakStop;try{rc.start();}catch(e){FX.rec=null;sp.textContent=U.speak;}});btns.push(sp);}
 btns.push(pbtn(U.historyTitle,showHistory),pbtn(U.close,closePanel));fixPanel.append(row(...btns));
 if(!portrait)ta.focus();}
async function propose(text,chapter){const utterance=text.trim();if(!utterance||FX.busy)return;FX.busy=true;fixDot.classList.remove('on');clearP();const w=mk('p','fxm',U.waiting);fixPanel.append(mk('h3','fxh',U.waiting),w);const t0=performance.now();FX.timer=setInterval(()=>{w.textContent=`${Math.round((performance.now()-t0)/1000)}秒`;},500);
 const tap=FX.tap?{label:FX.tap.label,surface:FX.tap.surface,x:FX.tap.x,y:FX.tap.y,z:FX.tap.z,u:FX.tap.u,v:FX.tap.v}:null;
 const a=await api('/api/propose',{utterance,p:FX.openP,chapter,tap});FX.busy=false;clearInterval(FX.timer);
 if(!a.ok){if(a.status===0||!a.data){await refreshState();showInput();return;}if(a.data.error==='no_api_key'){endMsg(U.button,[a.data.message],'fxw').append(row(pbtn(U.close,closePanel)));return;}showInput(a.data.message||U.noChange);return;}
 const d=a.data;if(d.status==='ok')return showProposal(d);
 clearP();
 if(d.status==='needs_check'){fixPanel.append(mk('h3','fxh fxw',U.checkTitle));fixPanel.append(mk('p','fxm',U.checkNote));listBlocked(d);}
 else if(d.status==='out_of_scope'){fixPanel.append(mk('h3','fxh fxw',U.cantTitle));fixPanel.append(mk('p','fxm',U.cantNote));listOut(d);}
 else fixPanel.append(mk('h3','fxh',U.noChange));
 fixPanel.append(row(pbtn(U.again,()=>showInput(),'fxk fxp1'),pbtn(U.close,closePanel)));}
function listBlocked(d){for(const b of d.blocked||[]){const x=mk('div','fxl');x.append(mk('b','',b.note||b.target));x.append(mk('span','',b.text));for(const r of b.reasons)x.append(mk('span','fxw',r));fixPanel.append(x);}}
function listOut(d){for(const b of d.out_of_scope||[]){const x=mk('div','fxl');x.append(mk('b','',b.request));x.append(mk('span','',b.reason));fixPanel.append(x);}}
// 前後の絵は、本物の3Dをその場で描いて写す
function shot(sc,q,w=640){useScene(sc);const p=pOfQ(q);cur=p;frozen=p;const v=apply(p,tt);renderAll(v);const cw=canvas.width,ch=canvas.height,sx=portrait?0:Math.max(0,.5+(viewX??0)/W-.31)*cw,sw=portrait?cw:.62*cw,sh=portrait?.62*ch:ch*.8,sy=portrait?0:.04*ch,c=document.createElement('canvas');c.width=w;c.height=Math.round(w*sh/sw);c.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,c.width,c.height);return c;}
const STEP_Q={look:.44,spray:.56,moist:.84,under:.93};
function showProposal(d){clearP();FX.pending=d;fixDot.classList.remove('on');
 fixPanel.append(mk('h3','fxh',d.summary||U.button));fixPanel.append(mk('p','fxn',U.previewNote));
 for(const c of d.changes){const x=mk('div','fxl');x.append(mk('b','',c.label));const t=mk('div','fxba');t.append(mk('span','',`${U.before}：${c.before}`),mk('span','fxa2',`${U.after}：${c.after}`));x.append(t);
  if(c.kind==='order'){for(const[lab,sc]of[[U.before,FX.base],[U.after,d.after]]){const s=mk('div','fxs');s.append(mk('i','',lab));for(const n of sc.craft.order)s.append(shot(sc,STEP_Q[n],200));x.append(s);}}
  else if(c.kind!=='text'){const g=mk('div','fxg');for(const[lab,sc]of[[U.before,FX.base],[U.after,d.after]]){const f=mk('figure');f.append(shot(sc,c.focus),mk('figcaption','',lab));g.append(f);}x.append(g);}
  fixPanel.append(x);}
 if(d.blocked&&d.blocked.length){fixPanel.append(mk('h4','fxw',U.checkTitle));listBlocked(d);}
 if(d.out_of_scope&&d.out_of_scope.length){fixPanel.append(mk('h4','fxw',U.cantTitle));listOut(d);}
 useScene(d.after);const first=d.changes.find(c=>c.kind!=='text')||d.changes[0],p=pOfQ(first.focus);frozen=p;cur=p;
 const ok=pbtn(U.ok,commitIt,'fxk fxp1'),no=pbtn(U.no,cancelIt);ok.id='fixOk';no.id='fixNo';const act=row(ok,no);act.classList.add('fxact');fixPanel.append(act);fixPanel.scrollTop=0;}
async function commitIt(){const d=FX.pending;if(!d||FX.busy)return;FX.busy=true;const a=await api('/api/commit',{id:d.id});FX.busy=false;
 if(!a.ok){cancelLocal();showInput(a.data&&a.data.message||U.noChange);return;}
 FX.pending=null;FX.base={chapters:a.data.scene.chapters,craft:a.data.scene.craft};useScene(FX.base);goP(frozen);await refreshState();
 const e=endMsg(U.saved,[`${U.count} ${a.data.count}${U.countUnit}`]);e.append(row(pbtn(U.historyTitle,showHistory),pbtn(U.close,closePanel,'fxk fxp1')));}
function cancelLocal(){FX.pending=null;useScene(FX.base);frozen=FX.openP;cur=FX.openP;}
async function cancelIt(){const d=FX.pending;if(!d)return;cancelLocal();showInput(U.cancelled);await api('/api/cancel',{id:d.id});}
async function showHistory(){await refreshState();clearP();const st=FX.st,es=st.history||[];fixPanel.append(mk('h3','fxh',U.historyTitle));
 if(!es.length)fixPanel.append(mk('p','fxm',U.historyEmpty));
 for(const e of [...es].reverse()){const x=mk('div','fxl'+(e.withdrawn_at?' fxo':''));x.append(mk('i','',new Date(e.at).toLocaleString('ja-JP')+(e.withdrawn_at?`　${U.withdrawn}`:'')));x.append(mk('b','',e.utterance_flagged?U.historyHidden:`「${e.utterance}」`));for(const c of e.changes||[])x.append(mk('span','',`${c.label}：${c.before} → ${c.after}`));fixPanel.append(x);}
 const b=[];if(st.server&&st.count>0){const u=pbtn(U.undo,async()=>{const a=await api('/api/undo',{});if(a.ok){FX.base={chapters:a.data.scene.chapters,craft:a.data.scene.craft};useScene(FX.base);await refreshState();showInput(U.undone);}else showInput(a.data&&a.data.message);});u.id='fixUndo';b.push(u);}
 b.push(pbtn(U.button,()=>showInput()),pbtn(U.close,closePanel));fixPanel.append(row(...b));}
fixBtn.onclick=()=>openPanel('input');fixCount.onclick=()=>openPanel('history');
canvas.addEventListener('click',e=>{if(!FX.open||!document.getElementById('fixText'))return;const h=pick(e.clientX,e.clientY);if(!h)return;FX.tap={...h,label:(U.places&&U.places[h.key])||h.key};fixDot.style.left=e.clientX+'px';fixDot.style.top=e.clientY+'px';fixDot.classList.add('on');const n=document.getElementById('fixTap');if(n)n.textContent=`${U.tapLabel}：${FX.tap.label}`;});
addEventListener('keydown',e=>{if(e.key!=='Escape'||!FX.open||FX.busy)return;if(FX.pending)cancelIt();else closePanel();});
refreshState();
window.__fix=()=>({open:FX.open,order:S.craft.order,H:LV.H,wide:LV.moldWide,q:qOf(cur),p:cur,frozen,WB:[...WB],tap:FX.tap});
if(qp.has('p')){frozen=+qp.get('p');cur=frozen;}
if(qp.has('auto')){const s=+qp.get('auto')||70,st=performance.now();(function a(n){const m=document.documentElement.scrollHeight-innerHeight,k=(n-st)/(s*1000);scrollTo(0,m*Math.min(1,k));if(k<1)requestAnimationFrame(a);})(st);}
const T_BUILD=Math.round(performance.now()-T_START);
const T_C0=performance.now();renderer.setRenderTarget(rtScene);try{await renderer.compileAsync(scene,camera);}catch(e){}renderer.setRenderTarget(null);window.__compileMs=Math.round(performance.now()-T_C0);
requestAnimationFrame(frame);
const bootOff=()=>{const b=document.getElementById('boot');if(b){b.style.opacity=0;setTimeout(()=>b.remove(),800);}};requestAnimationFrame(()=>requestAnimationFrame(bootOff));setTimeout(bootOff,1500);
</script>
