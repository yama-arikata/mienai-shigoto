 if(ch.play){const l=document.createElement('label');l.className='sl';l.textContent='切ってからの年';playEl=document.createElement('input');playEl.type='range';playEl.min=0;playEl.max=5.82;playEl.step=.01;playEl.value=0;playEl.setAttribute('aria-label','切ってからの年');l.append(playEl);s.append(l);

 capsEl.append(s);});

// ── 木の計算 ── 毎年「①光を計算 ②根からの勢いを芽に配る ③芽の行き先を決める」をくり返す。結果は決め打ちしない
const YSTART=-9,YEND=6,GX=40,GY=32,CELL=.2;

function addNode(T,par,x0,y0,z0,d,len,yr,shoot,idx,V,kind=0){const m=Math.hypot(d[0],d[1],d[2])||1,dx=d[0]/m,dy=d[1]/m,dz=d[2]/m;

 if(par)par.ch.push(o.id);T.n.push(o);return o;}
function light(T,y){const nx=GX,ny=GY,D=new Float32Array(nx*ny*nx),S=new Float32Array(nx*ny*nx),id=(i,j,k)=>i+k*nx+j*nx*nx;
 for(const a of T.n){if(a.dead<=y||a.cut)continue;const age=y-a.born,w=a.kind?1.5:age<=1?.8:.06;
  const i=Math.floor(a.x1/CELL+nx/2),j=Math.floor(a.y1/CELL),k=Math.floor(a.z1/CELL+nx/2);if(i<0||k<0||j<0||i>=nx||k>=nx||j>=ny)continue;D[id(i,j,k)]+=w;}
 let up=new Float32Array(nx*nx),tmp=new Float32Array(nx*nx);
 for(let j=ny-1;j>=0;j--){
  for(let k=0;k<nx;k++)for(let i=0;i<nx;i++){let s=0,c=0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const ii=i+a,kk=k+b;const w=(a||b)?.09:.28;c+=w;if(ii>=0&&kk>=0&&ii<nx&&kk<nx)s+=up[ii+kk*nx]*w;}tmp[i+k*nx]=s/c*.965;}
  for(let q=0;q<nx*nx;q++){const v=tmp[q]+D[q+j*nx*nx]*P.k;tmp[q]=v;S[q+j*nx*nx]=v;}

function latDir(T,n){const a=(n.idx*2.399963)+T.rng()*.5;let ux=-n.dz,uy=0,uz=n.dx;let m=Math.hypot(ux,uz);if(m<.15){ux=1;uz=0;m=1;}ux/=m;uz/=m;
 const vx=n.dy*uz-n.dz*uy,vy=n.dz*ux-n.dx*uz,vz=n.dx*uy-n.dy*ux,c=Math.cos(a),s=Math.sin(a);return[ux*c+vx*s+n.dx*.55,uy*c+vy*s+n.dy*.55,uz*c+vz*s+n.dz*.55];}
function growShoot(T,from,d,V,y,sprout){const r=T.rng,n=Math.max(1,Math.round(V/P.il)),sid=from.tipShoot&&!sprout&&d===null?from.shoot:T.n.length;
 let cur=from,dv=d||[from.dx,from.dy,from.dz],sidUse=d?T.n.length:from.shoot,start=d?0:from.idx+1,made=[];
 for(let i=0;i<n;i++){const upk=sprout?.32:.012+.07*V;dv=[dv[0]+(r()-.5)*.34,dv[1]+(r()-.5)*.24+upk-(V<.35?.07:0),dv[2]+(r()-.5)*.34];const m=Math.hypot(...dv);dv=dv.map(q=>q/m);

function step(T,y,keepGrid=false){const r=T.rng,L=light(T,y),alive=T.n.filter(a=>a.dead>y&&!a.cut);

  if(age===1&&a.bud===1){const pS=clamp((a.V-.12)/.5,0,.9)*Math.exp(-a.fromTip/4.5),pP=.72*horiz*sm(.1,.45,a.l),u=r();
   if(u<pS){a.bud=0;tips.push({n:a,d:latDir(T,a),w:.75});}else if(u<pS+pP){a.bud=0;addSpur(T,a,y);}else a.bud=2;}
  else if(age>=2&&age<=3&&a.bud===2){if(r()<.22*horiz*sm(.15,.5,a.l)){a.bud=0;addSpur(T,a,y);}}}
 // 勢いを配る（光のあたる芽・上向きの芽ほど多くもらう＝頂部優勢）
 let W=0;for(const t of tips){const a=t.n,dy=t.d?t.d[1]:a.dy;t.W=t.w*Math.pow(a.l,1.2)*(.5+.8*Math.pow(Math.max(0,dy),1.6))*(a.y1>3.4?Math.max(.08,1-(a.y1-3.4)*1.25):1)*(a.shoot===0?.55:1)*(Math.hypot(a.x1,a.z1)>2.15?Math.max(.15,1-(Math.hypot(a.x1,a.z1)-2.15)*2):1);W+=t.W;}
 let E=0;const new1=[];
 for(const t of tips){let V=W>0?B*t.W/W:0;if(V>P.vcap){E+=V-P.vcap;V=P.vcap;}
  const a=t.n;
  if(!t.d&&V<.1){a.weak++;if(a.weak>=2){a.tip=false;addSpur(T,a,y);}continue;}
  a.weak=0;if(!t.d)a.tip=false;new1.push(...growShoot(T,a,t.d,Math.max(V,.1),y,false));}
 // 使いきれない勢いは、古い枝の眠っていた芽から「まっすぐな枝」になって出る
 const cand=alive.filter(a=>!a.kind&&y-a.born>=2&&a.dy<.86&&a.r[y-YSTART]>=.012&&a.y1>.8&&a.l>.25);
 let ns=Math.min(Math.round(E/.8)+(r()<.5?1:0),cand.length);
 for(let i=0;i<ns;i++){const a=cand[Math.floor(r()*cand.length)];const V=.8+r()*.3;new1.push(...growShoot(T,a,[(r()-.5)*.25,1,(r()-.5)*.25],V,y,true));a.spr=true;}
 // 花と実
 let fr=0;for(const a of T.n){if(a.dead<=y||a.cut||!a.kind)continue;const age=y-a.born;
  const lNow=age?a.l:sampleL(L,a.x1,a.y1,a.z1);
  if(a.fb&&age>=1){T.flowers.push({x:a.x1,y:a.y1,z:a.z1,year:y});let set=lNow>.25&&r()<.8;if(set){T.fruits.push({x:a.x1,y:a.y1,z:a.z1,year:y,l:lNow,dx:a.dx,dz:a.dz});fr++;}a.fb=lNow>.35&&(!set||r()<.4);}
  else a.fb=lNow>.35;
  if(lNow<.14){a.dark++;if(a.dark>=2&&age>=1)a.dead=y+1;}else a.dark=0;}
 T.fruitBy[y]=fr;T.lastFruit=fr;
 // 葉
 for(const a of T.n){if(a.dead<=y||a.cut)continue;if(a.kind){const q=y-a.born>=0;if(q)T.leaves.push({a:a.id,year:y,c:4});}else if(a.born===y)T.leaves.push({a:a.id,year:y,c:2});}
 // 葉のない細い枝は枯れて落ちる
 for(let i=T.n.length-1;i>=0;i--){const a=T.n[i];if(a.dead<=y+1||a.cut||a.tip||a.kind)continue;if(a.ch.some(c=>{const b=T.n[c];return b.dead>y+1&&!b.cut;}))continue;if(y-a.born>=1&&a.r[y-YSTART]<.02&&!a.keepStub)a.dead=y+1;}

 for(let i=T.n.length-1;i>=0;i--){const a=T.n[i];if(a.cut){continue;}if(a.dead<=y)continue;let s=a.kind?P.spurR*P.spurR:a.tip?P.tipR*P.tipR:0;for(const c of a.ch){const b=T.n[c];if(b.cut||b.dead<=y)continue;const q=b.r[ix];s+=q*q;}if(!s)s=P.tipR*P.tipR;a.r[ix]=Math.max(a.r[ix-1]||0,Math.sqrt(s));}

 lim(3);const A=[.5,2.3,4.1,5.5,1.3];for(let i=0;i<5;i++){const a=A[i],d=[Math.cos(a),.42+(i>2?.3:0),Math.sin(a)];const s=addNode(T,c,c.x1,c.y1,c.z1,d,.24,y,T.n.length,0,1.2);s.bud=0;s.tip=true;s.scaffold=true;lim(i<4?1:2);}

const canvas=document.getElementById('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});}

function sliceFor(T,x){const g=T.grid[0],tx=new THREE.Data3DTexture(g,GX,GX,GY);tx.format=THREE.RedFormat;tx.type=THREE.UnsignedByteType;tx.minFilter=tx.magFilter=THREE.NearestFilter;tx.unpackAlignment=1;tx.needsUpdate=true;
 const u={uV:{value:tx},uZ:{value:0},uO:{value:0}};
 const m=new THREE.Mesh(new THREE.PlaneGeometry(GX*CELL,GY*CELL),new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false,glslVersion:THREE.GLSL3,
  vertexShader:`out vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`precision highp sampler3D;uniform sampler3D uV;uniform float uZ,uO;in vec3 vP;out vec4 oc;
  void main(){vec3 q=vec3(vP.x/${(GX*CELL).toFixed(2)}+.5,uZ/${(GX*CELL).toFixed(2)}+.5,(vP.y+${(GY*CELL/2).toFixed(2)})/${(GY*CELL).toFixed(2)});float l=texture(uV,q).r;
   vec3 c=mix(vec3(.015,.02,.16),vec3(.55,.1,.48),smoothstep(.05,.42,l));c=mix(c,vec3(1.,.74,.12),smoothstep(.42,.86,l));
   vec2 ce=fract(vec2(q.x*${GX}.,q.z*${GY}.));vec2 gp=step(vec2(.07),ce)*step(ce,vec2(.93));float y0=vP.y+${(GY*CELL/2).toFixed(2)};float a=step(l,.93)*gp.x*gp.y*step(.5,y0)*.9;oc=vec4(c,a*uO);if(oc.a<.003)discard;
   #include <colorspace_fragment>
   }`.replace('#include <colorspace_fragment>','oc.rgb=pow(oc.rgb,vec3(1./1.6));')}));
 m.position.set(0,GY*CELL/2,0);m.renderOrder=6;m.visible=false;x.g.add(m);return{m,u};}
const slN=sliceFor(TN,vN),slT=sliceFor(TT,vT);

// 光
const hemi=new THREE.HemisphereLight(0xffffff,0x6a6a5a,1);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(9,15,11);key.castShadow=true;key.shadow.mapSize.set(phone?1024:2048,phone?1024:2048);
Object.assign(key.shadow.camera,{left:-13,right:13,top:13,bottom:-13,near:1,far:50});key.shadow.bias=-.0004;key.shadow.normalBias=.02;key.shadow.radius=3;scene.add(key,key.target);

function envAt(t){const f=((t%1)+1)%1;let i=0;while(i<K.length-2&&f>K[i+1][0])i++;const a=K[i],b=K[i+1],q=(f-a[0])/(b[0]-a[0]);
 lerpC(skyTop,a[1],b[1],q);lerpC(skyBot,a[2],b[2],q);lerpC(grassC,a[3],b[3],q);lerpC(sunC,a[6],b[6],q);
 const sn=a[4]+(b[4]-a[4])*q;G.uSnow.value=sn;key.intensity=a[5]+(b[5]-a[5])*q;key.color.copy(sunC);
 hemi.intensity=.75+.25*key.intensity/3;scene.fog.color.copy(skyBot);
 lerpC(farC,'#7f97ad','#7f97ad',0);farM.color.copy(skyBot).lerp(skyTop,.62);farM2.color.copy(skyBot).lerp(skyTop,.8).lerp(grassC,.28*(1-sn)).multiplyScalar(.82);
 lerpC(cA,a[7],b[7],q);if(window.__blob){window.__blob.material.color.copy(cA).multiplyScalar(.5);const leaf=ss(.34,.4,f)*(1-ss(.87,.95,f));window.__blob.visible=leaf>.05;window.__blob.scale.setScalar(1);}}

// カメラ
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const camKeys=[
 {p:0,c:V(11.5,2,20.5),l:V(-.1,2.75,0)},{p:.1,c:V(10.8,2,19.2),l:V(-.1,2.75,0)},
 {p:.135,c:V(11.2,2.2,19.6),l:V(.1,2.55,0)},{p:.23,c:V(10.8,2.2,18.9),l:V(.1,2.55,0)},
 {p:.255,c:V(2.2,2.15,5.6),l:V(-.35,1.75,.2)},{p:.335,c:V(1.9,2.2,5),l:V(-.3,1.8,.2)},
 {p:.365,c:V(-.9,2.2,17.5),l:V(-3.4,2.3,0)},{p:.47,c:V(-.9,2.2,16.9),l:V(-3.4,2.3,0)},
 {p:.5,c:V(12,1.9,22),l:V(.1,3.1,0)},{p:.72,c:V(11.5,1.9,21),l:V(.1,3.1,0)},
 {p:.75,c:V(9,2.3,7.6),l:V(5.7,2,0)},{p:.85,c:V(8.4,2.3,6.8),l:V(5.7,2.1,0)},
 {p:.87,c:V(3.5,2.5,7.4),l:V(0,1.8,0)},{p:1,c:V(3.3,2.5,7.2),l:V(0,1.8,0)}];
const cp=new THREE.Vector3(),cl=new THREE.Vector3();
function camAt(p){let i=0;while(i<camKeys.length-2&&p>camKeys[i+1].p)i++;const a=camKeys[i],b=camKeys[i+1],t=ss(a.p,b.p,p);cp.copy(a.c).lerp(b.c,t);cl.copy(a.l).lerp(b.l,t);}

const caps=[...document.querySelectorAll('.cap')].map(el=>({el,a:+el.dataset.a,b:+el.dataset.b}));
const hint=document.getElementById('hint'),barI=document.querySelector('#bar i'),yrEl=document.getElementById('yr'),fadeEl=document.getElementById('fade');
// 木の名札
const lab=[vN,vT,vO].map((v,i)=>{const d=document.createElement('div');d.className='tl';d.innerHTML=`<span>${S.trees[i].name}</span><u><i></i></u>`;document.getElementById('labels').append(d);return{v,d,bar:d.querySelector('i'),trk:d.querySelector('u'),T:v.T};});
function resize(){W=innerWidth;H=innerHeight;portrait=W<=760||W/H<=1;renderer.setSize(W,H,false);camera.aspect=W/H;camera.fov=portrait?52:36;
 if(portrait)camera.setViewOffset(W,H,0,H*.2,W,H);else camera.setViewOffset(W,H,-W*.17,0,W,H);camera.updateProjectionMatrix();
 vN.g.position.x=-SP();vO.g.position.x=SP();}
addEventListener('resize',resize);resize();

const season=f=>f<.2?'冬':f<.38?'春':f<.68?'夏':f<.9?'秋':'冬';
const tv=new THREE.Vector3();
let userT=0,playing=null,hoverSet=null,inPlay=false,cutStart=0,playT=0;
function fruitAt(T,t){const y=Math.floor(Math.min(t,5.999)),f=t-y;return f>.5?(T.fruitBy[y]||0):(T.fruitBy[y-1]||0);}
function apply(p,now){
 // 時間：切った冬(0)→夏で光→5年
 let t=0;
 if(p>=.335)t=.55*ss(.335,.375,p);
 if(p>=.47)t=.55+(5.82-.55)*Math.min(1,(p-.47)/(.715-.47));
 if(p>=.715)t=5.82+(5.99-5.82)*ss(.715,.75,p);
 const play=p>=.87;inPlay=play;
 envAt(play?userT:t);
 const thinK=ss(.15,.185,p),overK=ss(.185,.22,p);
 const hlT=ss(.135,.15,p)*(1-thinK),hlO=ss(.17,.185,p)*(1-overK);
 const age=ss(.25,.27,p)*(1-ss(.325,.345,p));
 const sliceOn=ss(.37,.395,p)*(1-ss(.455,.48,p));
 const spr=ss(.76,.79,p)*(1-ss(.85,.87,p));
 const lk=1-.78*sliceOn;
 vN.update(t,{leafK:lk});vT.update(t,{cutK:thinK,hl:hlT,age,leafK:lk});vO.update(t,{cutK:overK,hl:hlO,spr,leafK:lk});
 vU.g.visible=play;vN.g.visible=vT.g.visible=vO.g.visible=!play;
 if(play){const cn=cutStart?ss(.12,.62,(now-cutStart)/1000):1;vU.update(userT,{cutK:1,cutNew:cn,pick:hoverSet});}
 slN.m.visible=slT.m.visible=sliceOn>.002;
 if(sliceOn>.002){const z=1.5-1.5*ss(.375,.42,p);for(const s of[slN,slT]){s.u.uO.value=sliceOn;s.u.uZ.value=z;s.m.position.z=z;}}
 fadeEl.style.opacity=ss(.85,.865,p)*(1-ss(.87,.885,p));
 camAt(p);
 if(portrait){const dS=5.7-SP(),b=ss(.115,.135,p)*(1-ss(.23,.255,p)),sl=ss(.34,.365,p)*(1-ss(.47,.5,p)),ov=ss(.72,.75,p)*(1-ss(.85,.87,p));
  cl.x+=-1.2*b+dS*.5*sl-dS*ov;cp.x+=-1.2*b*1.8+dS*.5*sl-dS*ov;
  const d=cp.clone().sub(cl);camera.position.copy(cl).add(d.multiplyScalar(p>.24&&p<.34?1.12:(p>.86?1.28:p>.73?1.1:1.32+.28*b)));}else camera.position.copy(cp);
 camera.lookAt(cl);
 // 年と名札
 const lapse=p>.47&&p<.75,yy=Math.floor(Math.min(t,5.99)),ff=t-yy;
 const yU=Math.floor(Math.min(userT,5.99)),fU=userT-yU;yrEl.style.opacity=play?ss(.885,.9,p):ss(.475,.49,p)*(1-ss(.72,.735,p));
 if(+yrEl.style.opacity>0)yrEl.textContent=play?(yU===0?'切った年':yU+'年後')+'の'+season(fU):(yy===0?'切った年':yy+'年後')+'の'+season(ff);
 for(const q of lab){const show=(q.v===vT?ss(.135,.15,p):q.v===vO?ss(.17,.185,p):ss(.135,.15,p))*(1-ss(.232,.245,p))+ss(.48,.5,p)*(1-ss(.725,.74,p))+(q.v!==vO?ss(.385,.4,p)*(1-ss(.455,.47,p)):0)+(q.v===vO?ss(.755,.78,p)*(1-ss(.85,.865,p)):0);
  q.d.style.opacity=Math.min(1,show);q.trk.style.visibility=(p>.48&&p<.74)?'visible':'hidden';
  if(show>.01){tv.set(q.v.g.position.x,5.15,0);tv.project(camera);q.d.style.transform=`translate(${(tv.x*.5+.5)*W}px,${(-tv.y*.5+.5)*H-34}px)`;q.bar.style.width=(fruitAt(q.T,t)/maxFruit*100)+'%';}}
 if(play){barN.style.width=(fruitAt(TN,userT)/maxFruit*100)+'%';barU.style.width=(fruitAt(TU,userT)/maxFruit*100)+'%';}
 for(const c of caps){const o=(c.a<=0?1:ss(c.a-.012,c.a+.008,p))*(1-ss(c.b-.008,c.b+.012,p));c.el.style.opacity=o;c.el.style.visibility=o>.01?'visible':'hidden';c.el.style.pointerEvents=o>.8?'auto':'none';}
 hint.style.opacity=p<.03?1:0;barI.style.height=(p*100)+'%';
}
// ── 触るところ：枝を切る→計算し直す→5年すすむ
function pickBranch(cx,cy){if(userT>.14)return null;let best=-1,bd=phone?34:24;const ns=TU.n;for(const a of ns){if(a.born>=0||a.dead<=0||a.cut||a.shoot===0)continue;tv.set(a.x1,a.y1,a.z1);tv.project(camera);const x=(tv.x*.5+.5)*W,y=(-tv.y*.5+.5)*H,d=Math.hypot(x-cx,y-cy);if(d<bd){bd=d;best=a.id;}}
 if(best<0)return null;let a=ns[best];while(a.kind&&a.p>=0)a=ns[a.p];const up=q=>{while(q.p>=0&&ns[q.p].shoot===q.shoot)q=ns[q.p];return q;};let h=up(a);
 const size=q=>{let c=0;kids(TU,q,b=>{if(b.born<0)c++;});return c;};while(size(h)<26&&h.p>=0&&ns[h.p].shoot!==0)h=up(ns[h.p]);
 return h.shoot===0?null:h.id;}
function setPick(id){if(id==null){hoverSet=null;return;}const s=new Set();kids(TU,TU.n[id],b=>{if(b.born<0)s.add(b.id);});hoverSet=s;}
function rebuildUser(){const T=cloneTree(BASE,S.growSeed);for(const id of userCuts)cutWhole(T,T.n[id]);runFuture(T);basis(T);TU=T;if(userCuts.length)kids(T,T.n[userCuts[userCuts.length-1]],b=>{if(b.born<0)b.cutNew=true;});vU.set(T);hoverSet=null;}
function stopPlay(){if(playing)cancelAnimationFrame(playing);playing=null;}
function playFwd(){stopPlay();if(prm){userT=5.82;playEl.value=userT;return;}const st=performance.now(),a=userT;(function s(n){const k=Math.min(1,(n-st)/6500);userT=a+(5.82-a)*k;playEl.value=userT;if(k<1)playing=requestAnimationFrame(s);else playing=null;})(st);}
playEl.addEventListener('input',()=>{clearTimeout(playT);stopPlay();userT=+playEl.value;});
rstEl.addEventListener('click',()=>{clearTimeout(playT);cutStart=0;stopPlay();userCuts=[];rebuildUser();userT=0;playEl.value=0;});
let dn=null;
addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()};});
addEventListener('pointermove',e=>{if(!inPlay||e.pointerType==='touch'||e.target.closest&&e.target.closest('.cap'))return;setPick(pickBranch(e.clientX,e.clientY));});
addEventListener('pointerup',e=>{if(!dn||!inPlay)return;const mv=Math.hypot(e.clientX-dn.x,e.clientY-dn.y),dt=performance.now()-dn.t;dn=null;if(mv>10||dt>600||(e.target.closest&&e.target.closest('.cap')))return;
 if(userT>.14){clearTimeout(playT);stopPlay();userT=0;playEl.value=0;return;}
 const id=pickBranch(e.clientX,e.clientY);if(id==null)return;userCuts.push(id);rebuildUser();cutStart=performance.now();stopPlay();clearTimeout(playT);playT=setTimeout(playFwd,prm?0:750);});

const prm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const prog=()=>{const m=document.documentElement.scrollHeight-innerHeight;return m>0?Math.min(1,Math.max(0,scrollY/m)):0;};
let cur=prog(),last=performance.now(),frozen=null;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 const target=frozen??prog();cur+=(target-cur)*(frozen!==null||prm?1:Math.min(1,dt*5));
 apply(cur,now);renderer.render(scene,camera);requestAnimationFrame(frame);}
window.__seek=p=>{frozen=p;cur=p;apply(p,0);renderer.render(scene,camera);return renderer.info.render.triangles;};
window.__release=()=>{frozen=null;};
window.__stats=()=>({none:TN.fruitBy,thin:TT.fruitBy,over:TO.fruitBy,user:TU.fruitBy,cuts:userCuts.length,nodes:[TN,TT,TO].map(T=>T.n.length),leaves:[TN,TT,TO].map(T=>T.leaves.length)});
const q=new URLSearchParams(location.search);
if(q.has('p'))frozen=+q.get('p');
if(q.has('t')){userT=+q.get('t');playEl.value=userT;}
if(q.has('auto')){const s=+q.get('auto')||70,st=performance.now();(function a(n){const m=document.documentElement.scrollHeight-innerHeight,k=(n-st)/(s*1000);scrollTo(0,m*Math.min(1,k));if(k<1)requestAnimationFrame(a);})(st);}
requestAnimationFrame(frame);
</script>
